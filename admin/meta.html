<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Meta Ads — Painel da empresa</title><link rel="stylesheet" href="../css/admin.css?v=final-20260814-1"><style>.meta-shell{max-width:1080px;margin:0 auto;padding:32px}.meta-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}.meta-card{background:#fff;border:1px solid #e6e7eb;border-radius:16px;padding:22px;margin-bottom:18px}.meta-status{display:inline-flex;padding:7px 10px;border-radius:999px;background:#eef2f7;font-weight:700}.meta-status.ok{background:#e8f7ef;color:#087a42}.account{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:14px 0;border-top:1px solid #eee}.account:first-child{border-top:0}.account small{display:block;color:#687386;margin-top:4px}.meta-btn{display:inline-block;border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none}.meta-btn.primary{background:#111827;color:white}.meta-btn[disabled]{opacity:.55;cursor:not-allowed}.back{color:#26364b;text-decoration:none;font-weight:800}.empty{padding:22px 0;color:#687386}.feedback{margin-top:12px;color:#687386}</style></head><body><main class="meta-shell"><div class="meta-head"><div><small>META ADS</small><h1 id="page-title">Conta de anúncios da empresa</h1><p id="page-subtitle">Conecte a conta Meta desta empresa para criar e administrar campanhas no RADZ.</p></div><a class="back" href="/admin/">← Voltar ao painel</a></div><section class="meta-card"><h2>Status da conexão</h2><div id="status" class="meta-status">Carregando…</div><p id="connection"></p><div id="connect-wrap"></div></section><section class="meta-card"><h2>Contas de anúncios</h2><div id="accounts" class="empty">Carregando contas…</div><p id="feedback" class="feedback"></p></section></main><script>(function(){const status=document.getElementById('status'),connection=document.getElementById('connection'),accounts=document.getElementById('accounts'),feedback=document.getElementById('feedback'),connectWrap=document.getElementById('connect-wrap'),title=document.getElementById('page-title');let csrf=sessionStorage.getItem('salvatexAdminCsrf')||'';async function api(options={}){const r=await fetch('/admin/api/meta',{credentials:'same-origin',...options,headers:{'content-type':'application/json',...(options.headers||{}),...(csrf?{'x-csrf-token':csrf}:{})}});let d={};try{d=await r.json()}catch{}if(r.status===401){location.href='/admin/';throw new Error('Sessão expirada.')}if(!r.ok)throw new Error(d.message||'Não foi possível carregar o Meta Ads.');return d}function render(d){if(d.storeName){title.textContent='Meta Ads — '+d.storeName;document.title='Meta Ads — '+d.storeName}status.textContent=d.connected?'Conectado':'Não conectado';status.classList.toggle('ok',d.connected);if(d.connected){connection.textContent='Conta Meta: '+(d.integration?.metaUserName||d.integration?.metaUserId||'conectada');connectWrap.innerHTML='<a class="meta-btn primary" href="'+d.connectUrl+'">Reconectar / trocar conta Meta</a>'}else{connection.textContent='Esta empresa ainda não conectou uma conta Meta própria.';connectWrap.innerHTML='<p><a class="meta-btn primary" href="'+d.connectUrl+'">Conectar conta Meta desta empresa</a></p>'}const rows=d.adAccounts||[];accounts.className='';accounts.innerHTML=d.connected?(rows.length?rows.map(a=>`<div class="account"><div><strong>${a.name||('Conta '+a.id)}</strong><small>${a.graphId} · ${a.currency||'moeda não informada'} · ${a.timezone||'fuso não informado'}</small></div><button class="meta-btn ${a.selected?'':'primary'}" data-account="${a.id}" ${a.selected?'disabled':''}>${a.selected?'Selecionada':'Usar esta conta'}</button></div>`).join(''):'<div class="empty">Nenhuma conta de anúncios encontrada nesta conta Meta.</div>'):'<div class="empty">Conecte primeiro a conta Meta desta empresa para listar as contas de anúncios.</div>';accounts.querySelectorAll('[data-account]').forEach(b=>b.onclick=()=>select(b.dataset.account));}async function load(){try{render(await api())}catch(e){status.textContent='Erro';connection.textContent=e.message;accounts.innerHTML='<div class="empty">'+e.message+'</div>'}}async function select(id){feedback.textContent='Salvando…';try{await api({method:'PATCH',body:JSON.stringify({accountId:id})});feedback.textContent='Conta selecionada.';await load()}catch(e){feedback.textContent=e.message}}const p=new URLSearchParams(location.search);if(p.get('meta')){feedback.textContent=p.get('meta')==='connected'?'Conta Meta conectada com sucesso.':(p.get('detail')||'Não foi possível concluir a conexão Meta.');history.replaceState({},'',location.pathname)}load();})();</script></body></html>
