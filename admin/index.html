<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Painel administrativo — RADZ HUB</title>
  <link rel="stylesheet" href="../css/admin.css?v=final-20260818-2">
  <link rel="stylesheet" href="../css/admin-messages.css?v=20260815-7">
  <style>
    #admin-nav .analytics-nav-link{display:flex;align-items:center;gap:11px;width:100%;box-sizing:border-box;padding:11px 14px;border:0;border-radius:9px;background:transparent;color:inherit;text-decoration:none;font:inherit;text-align:left;cursor:pointer}#admin-nav .analytics-nav-link:hover,#admin-nav .analytics-nav-link.active{background:rgba(255,255,255,.08)}
    .login-help{display:flex;justify-content:flex-end;margin-top:-4px}.login-help button{border:0;background:none;color:#315b7d;cursor:pointer;font:inherit;font-size:13px;padding:4px 0}.login-help button:hover{text-decoration:underline}.login-notice{font-size:13px;line-height:1.45;margin-top:10px;color:#52606d}.login-notice.success{color:#1b7f46}.login-notice.error{color:#b42318}
    .sidebar{height:100vh;overflow:hidden}.sidebar #admin-nav{max-height:calc(100vh - 220px);overflow-y:auto;overflow-x:hidden;padding-right:4px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.28) transparent}.sidebar #admin-nav::-webkit-scrollbar{width:6px}.sidebar #admin-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28);border-radius:999px}.sidebar #admin-nav::-webkit-scrollbar-track{background:transparent}
    [hidden]{display:none!important}
  </style>
</head>
<body>
<div id="admin-login" class="admin-login">
  <form id="login-form" class="login-card">
    <div class="login-brand">RADZ<small>HUB</small></div>
    <h1>Painel administrativo</h1>
    <p>Entre com o e-mail e a senha cadastrados para sua empresa.</p>
    <label>E-mail<input id="admin-token-input" type="email" autocomplete="username" required></label>
    <label>Senha<input id="admin-password-input" type="password" autocomplete="current-password" required></label>
    <div class="login-help"><button type="button" id="forgot-password">Esqueci minha senha</button></div>
    <button type="submit">Entrar no painel</button>
    <div id="login-error" class="login-error"></div>
    <div id="login-notice" class="login-notice"></div>
  </form>
</div>

<div id="admin-app" class="admin-app" hidden>
  <aside class="sidebar">
    <a href="#dashboard" class="brand">RADZ<small>HUB</small></a>
    <nav id="admin-nav">
      <button data-view="dashboard" class="active"><span>⌂</span>Dashboard</button>
      <button data-view="orders"><span>▣</span>Vendas <b id="nav-order-count" class="nav-badge">0</b></button>
      <button data-view="products"><span>◇</span>Produtos</button>
      <button data-view="categories"><span>□</span>Categorias</button>
      <div class="admin-nav-group admin-nav-group-customers open">
        <button type="button" id="customers-nav-toggle" class="admin-nav-parent"><span>♙</span>Clientes <i>⌄</i></button>
        <div class="admin-nav-children">
          <button data-view="customers">Lista de clientes</button>
          <button data-view="messages">Mensagens <b id="nav-message-count" class="nav-badge">0</b></button>
        </div>
      </div>
      <button data-view="pages"><span>▤</span>Páginas e menu</button>
      <button data-view="layout"><span>✦</span>Layout do site</button>
      <button data-view="media"><span>▧</span>Mídia</button>
      <button data-view="coupons"><span>✂</span>Cupons</button>
      <button type="button" class="analytics-nav-link" data-radz-panel="analytics"><span>◉</span>Visitas e conversão</button>
      <button type="button" class="analytics-nav-link" data-radz-panel="marketing"><span>◎</span>Marketing e Analytics</button>
      <button type="button" class="analytics-nav-link" data-radz-panel="meta"><span>◌</span>Meta Ads (Beta)</button>
      <button data-view="reports"><span>▥</span>Relatórios</button>
      <button data-view="configurators"><span>◫</span>Configuradores</button>
      <button data-view="settings"><span>⚙</span>Configurações</button>
      <button data-view="integrations"><span>⛓</span>Integrações</button>
      <button data-view="billing"><span>R$</span>Plano e cobrança</button>
      <button data-view="logs"><span>☷</span>Logs do Sistema</button>
    </nav>
    <a class="view-store" href="../index.html" target="_blank">Ver loja ↗</a>
    <div class="sidebar-user"><div class="avatar">A</div><div><strong>Administrador</strong><small>Painel da empresa</small></div><button id="logout" title="Sair">↪</button></div>
  </aside>

  <main class="main">
    <header class="admin-header"><div class="header-left"><button id="menu-toggle" class="icon-btn">☰</button><div><h1 id="view-title">Dashboard</h1><span id="view-subtitle">Visão geral da sua loja</span></div></div><div class="header-actions"><a href="../index.html" target="_blank" class="outline-btn">Visitar loja ↗</a><button id="refresh-view" class="outline-btn">Atualizar ↻</button></div></header>
    <div id="view-content" class="content"></div>
  </main>
</div>

<div id="admin-modal" class="modal" hidden><div class="modal-backdrop" data-close-modal></div><div class="modal-card"><button class="modal-close" data-close-modal>×</button><div id="modal-content"></div></div></div>
<div id="admin-toast" class="admin-toast"></div>
