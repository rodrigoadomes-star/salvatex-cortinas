<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Visitas e conversão | RADZ HUB</title><style>body{margin:0;background:#f5f7fb;color:#172033;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.top a{color:#172033;text-decoration:none}.top h1{margin:3px 0;font-size:28px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input,.filters button{border:1px solid #dce2eb;border-radius:9px;padding:9px 12px;background:white}.filters button{background:#09243a;color:white;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #e3e8ef;border-radius:14px;padding:18px;box-shadow:0 5px 18px #1720330a}.card small{color:#667085}.card strong{display:block;font-size:25px;margin-top:5px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-top:14px}.panel h2{margin:0 0 14px;font-size:17px}.bar{display:grid;grid-template-columns:120px 1fr 52px;gap:8px;align-items:center;margin:9px 0}.track{height:9px;background:#eef2f6;border-radius:9px;overflow:hidden}.fill{height:100%;background:#ad8246;border-radius:9px}.funnel{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.step{text-align:center;background:#f8fafc;border-radius:10px;padding:13px 8px}.step strong{font-size:20px;display:block}.muted{color:#667085}.error{padding:14px;background:#fff2f0;border:1px solid #f5c5bd;border-radius:10px;color:#9b291c}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #eef1f5}@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.funnel{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.bar{grid-template-columns:95px 1fr 42px}.wrap{padding:14px}}</style></head><body><main class="wrap"><div class="top"><div><a href="/admin/">← Voltar ao painel</a><h1>Visitas e conversão</h1><div class="muted">Analytics próprio da loja, independente da Meta.</div></div><div class="filters"><input id="from" type="date"><input id="to" type="date"><button id="load">Atualizar</button></div></div><div id="app"><div class="panel">Carregando…</div></div></main><script>const $=s=>document.querySelector(s),fmt=n=>new Intl.NumberFormat('pt-BR').format(Number(n||0)),money=c=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(c||0)/100);const today=new Date(),fromDefault=new Date(Date.now()-29*86400000);$('#to').value=today.toISOString().slice(0,10);$('#from').value=fromDefault.toISOString().slice(0,10);function bars(rows,key,label){const max=Math.max(1,...rows.map(r=>Number(r[key]||0)));return rows.map(r=>`<div class="bar"><span title="${String(r[label]||'')}">${String(r[label]||'—').slice(0,25)}</span><div class="track"><div class="fill" style="width:${Math.max(2,Number(r[key]||0)/max*100)}%"></div></div><b>${fmt(r[key])}</b></div>`).join('')||'<span class="muted">Sem dados no período.</span>'}async function load(){const app=$('#app');app.innerHTML='<div class="panel">Carregando…</div>';try{const r=await fetch(`/admin/api/analytics?from=${encodeURIComponent($('#from').value)}&to=${encodeURIComponent($('#to').value)}`,{credentials:'same-origin'}),d=await r.json();if(!r.ok)throw new Error(d.message||d.code||'Falha ao carregar analytics');const s=d.summary||{};app.innerHTML=`<section class="cards"><div class="card"><small>Visitantes únicos</small><strong>${fmt(s.visitors)}</strong></div><div class="card"><small>Sessões</small><strong>${fmt(s.sessions)}</strong></div><div class="card"><small>Visualizações</small><strong>${fmt(s.page_views)}</strong></div><div class="card"><small>Conversão</small><strong>${Number(s.conversionRate||0).toFixed(2).replace('.',',')}%</strong></div></section><section class="panel" style="margin-top:14px"><h2>Funil da loja</h2><div class="funnel"><div class="step"><small>Visitas</small><strong>${fmt(s.page_views)}</strong></div><div class="step"><small>Produtos</small><strong>${fmt(s.product_views)}</strong></div><div class="step"><small>Carrinho</small><strong>${fmt(s.add_to_cart)}</strong></div><div class="step"><small>Checkout</small><strong>${fmt(s.checkout_started)}</strong></div><div class="step"><small>Pedidos</small><strong>${fmt(s.orders)}</strong></div></div><p><b>Receita atribuída:</b> ${money(s.revenue_cents)}</p></section><div class="grid"><section class="panel"><h2>Origem das visitas</h2>${bars(d.sources||[],'visits','source')}</section><section class="panel"><h2>Dispositivos</h2>${bars(d.devices||[],'visits','device')}</section><section class="panel"><h2>Páginas mais acessadas</h2>${bars(d.pages||[],'views','path')}</section><section class="panel"><h2>Histórico diário</h2><table><thead><tr><th>Dia</th><th>Visitas</th><th>Carrinhos</th><th>Pedidos</th></tr></thead><tbody>${(d.series||[]).slice(-14).reverse().map(x=>`<tr><td>${x.event_date}</td><td>${fmt(x.page_views)}</td><td>${fmt(x.add_to_cart)}</td><td>${fmt(x.orders)}</td></tr>`).join('')||'<tr><td colspan="4">Sem dados.</td></tr>'}</tbody></table></section></div>`}catch(e){app.innerHTML=`<div class="error"><b>Analytics ainda não disponível.</b><br>${e.message}</div>`}}$('#load').onclick=load;load();</script></body></html>
