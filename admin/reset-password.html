<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Redefinir senha — RADZ HUB</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f8;font-family:Inter,Arial,sans-serif;color:#101828;padding:24px}.card{width:min(440px,100%);background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:32px;box-shadow:0 18px 60px rgba(16,24,40,.08)}.brand{font-weight:800;letter-spacing:.18em;color:#071b2e;font-size:22px}.brand small{display:block;font-size:9px;letter-spacing:.42em;margin-top:2px}h1{font-size:26px;margin:26px 0 8px}p{color:#667085;line-height:1.5;margin:0 0 22px}label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}input{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:13px 14px;font-size:15px;outline:none}input:focus{border-color:#315b7d;box-shadow:0 0 0 3px rgba(49,91,125,.12)}button{width:100%;border:0;border-radius:10px;background:#071b2e;color:#fff;padding:14px 18px;font-weight:700;font-size:15px;margin-top:20px;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.msg{font-size:13px;line-height:1.45;margin-top:14px}.msg.error{color:#b42318}.msg.success{color:#1b7f46}.back{display:block;text-align:center;margin-top:18px;color:#315b7d;text-decoration:none;font-size:14px}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">RADZ<small>HUB</small></div>
    <h1>Criar nova senha</h1>
    <p>Defina uma nova senha para o painel administrativo desta empresa.</p>
    <form id="reset-form">
      <label for="password">Nova senha</label>
      <input id="password" type="password" autocomplete="new-password" minlength="10" required>
      <label for="confirm">Confirmar nova senha</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="10" required>
      <button id="submit" type="submit">Salvar nova senha</button>
      <div id="msg" class="msg"></div>
    </form>
    <a class="back" href="/admin/">Voltar para o login</a>
  </main>
<script>
(function(){
  const form=document.getElementById('reset-form'),msg=document.getElementById('msg'),button=document.getElementById('submit');
  const token=new URLSearchParams(location.search).get('token')||'';
  if(!token){msg.textContent='Link de redefinição inválido.';msg.className='msg error';button.disabled=true}
  form.addEventListener('submit',async function(e){
    e.preventDefault();msg.textContent='';msg.className='msg';
    const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;
    if(password.length<10){msg.textContent='A senha deve ter pelo menos 10 caracteres.';msg.className='msg error';return}
    if(password!==confirm){msg.textContent='As senhas não coincidem.';msg.className='msg error';return}
    button.disabled=true;
    try{
      const r=await fetch('/admin/api/reset-password',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({token,password})});
      const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'Não foi possível redefinir a senha.');
      msg.textContent=d.message||'Senha criada com sucesso.';msg.className='msg success';form.querySelectorAll('input').forEach(i=>i.disabled=true);button.textContent='Senha atualizada';setTimeout(()=>location.href='/admin/',1800);
    }catch(err){msg.textContent=err.message;msg.className='msg error';button.disabled=false}
  });
})();
</script>
</body>
</html>
