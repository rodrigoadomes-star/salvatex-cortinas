<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Criar loja — RADZ HUB</title><link rel="stylesheet" href="/platform/platform.css"></head>
<body><header class="top"><a class="logo" href="/platform/">RADZ <small>HUB</small></a><a href="/platform/login.html">Já tenho cadastro</a></header>
<main class="auth"><form id="register-form" class="auth-card"><span class="eyebrow">CADASTRO GRATUITO</span><h1>Crie sua loja</h1><p>Você poderá personalizar tudo pelo painel.</p>
<div class="grid"><label>Seu nome<input name="name" autocomplete="name" maxlength="160" required></label><label>Telefone<input name="phone" inputmode="tel" maxlength="20" required></label></div>
<label>E-mail profissional<input name="email" type="email" autocomplete="email" maxlength="320" required></label>
<div class="grid"><label>Nome fantasia<input name="tradeName" maxlength="180" required></label><label>Razão social<input name="legalName" maxlength="220" required></label></div>
<div class="grid"><label>CNPJ<input name="cnpj" inputmode="numeric" maxlength="18" required></label><label>Segmento<input name="segment" maxlength="120" placeholder="Ex.: Moda, decoração"></label></div>
<label>Endereço inicial da loja<div class="slug"><input name="storeSlug" maxlength="63" pattern="[a-z0-9-]+" required><span>.radzhub.com.br</span></div></label>
<label>Senha<input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required><small>Mínimo de 10 caracteres, com maiúscula, minúscula e número.</small></label>
<label class="check"><input name="terms" type="checkbox" required> Li e aceito os Termos de Uso e a Política de Privacidade.</label>
<div id="turnstile-slot"></div><button class="button full" type="submit">Criar minha loja</button><p id="form-message" class="message" role="alert"></p></form></main>
<script src="/platform/platform.js"></script></body></html>
