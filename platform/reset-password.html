<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Redefinir senha — RADZ HUB</title><style>:root{--bg:#07111d;--panel:#0b1928;--line:#1d3148;--text:#eef5fb;--muted:#9db0c3;--cyan:#5ee7f3;--violet:#8b7cff;--green:#55dda0;--danger:#ff7f8b}*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 78% 8%,#24315a 0,transparent 32%),radial-gradient(circle at 10% 62%,#0e3b46 0,transparent 29%),var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,-apple-system,Segoe UI,sans-serif;padding:24px}.card{width:min(460px,100%);border:1px solid var(--line);border-radius:24px;background:#0a1725;padding:36px;box-shadow:0 28px 80px #0006}.logo{font-weight:950;font-size:22px;letter-spacing:2px;margin-bottom:24px}.logo small{display:block;font-size:8px;line-height:1;letter-spacing:4px;color:var(--muted)}h1{font-size:34px;line-height:1.05;margin:0 0 10px}p{color:var(--muted)}label{display:grid;gap:7px;margin:17px 0;font-weight:750}input{width:100%;padding:14px;border:1px solid #29415b;border-radius:11px;background:#07111d;color:#fff;font:inherit;outline:none}input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #5ee7f31c}.button{width:100%;border:0;border-radius:11px;padding:14px;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#06101c;font-weight:900;font-size:16px;cursor:pointer;margin-top:10px}.message{min-height:24px;text-align:center;font-weight:700;margin-top:14px}.message.error{color:var(--danger)}.message.ok{color:var(--green)}a{color:var(--cyan);text-decoration:none;font-weight:800}</style></head><body><form id="reset-form" class="card"><div class="logo">RADZ <small>HUB</small></div><h1>Criar nova senha</h1><p>Defina uma nova senha para sua conta.</p><label>Nova senha<input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><label>Confirmar senha<input name="confirm" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><button class="button" type="submit">Salvar nova senha</button><p id="message" class="message" role="alert"></p><p style="text-align:center"><a href="/platform/login">Voltar para o login</a></p></form><script>(function(){const form=document.getElementById('reset-form'),msg=document.getElementById('message'),token=new URLSearchParams(location.search).get('token')||'';const show=(t,ok=false)=>{msg.textContent=t;msg.className='message '+(ok?'ok':'error')};form.addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form).entries());if(data.password!==data.confirm){show('As senhas não coincidem.');return}show('Salvando...',true);try{const r=await fetch('/platform/api/reset-password',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'content-type':'application/json'},body:JSON.stringify({token,password:data.password})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'Não foi possível alterar a senha.');show(d.message||'Senha alterada com sucesso.',true);setTimeout(()=>location.assign('/platform/login'),1500)}catch(err){show(err.message)}});if(!token)show('Link de redefinição inválido.');})();</script></body></html>
