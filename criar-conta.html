<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar uma conta</title><link rel="stylesheet" href="css/style.css?v=account-20260815-2"></head><body><header class="topbar storefront-topbar"><div class="shell nav"><a class="logo" href="index.html">LOJA</a><nav class="navlinks"><a href="index.html">Início</a></nav><a href="carrinho.html" class="carrinho-link-topo">🛒 <span class="carrinho-texto">Carrinho</span></a></div></header><main class="account-page shell"><div class="account-head"><div><div class="kicker">MINHA CONTA</div><h1>Criar uma conta</h1><p>Compre mais rápido e acompanhe seus pedidos em um só lugar.</p></div></div><section id="account-login" class="account-auth-card"><form id="email-register-form" class="account-form"><label>Nome completo<input name="name" autocomplete="name" maxlength="120" required></label><label>E-mail<input name="email" type="email" autocomplete="email" maxlength="254" required></label><label>Telefone (opcional)<input name="phone" type="tel" autocomplete="tel" maxlength="30"></label><label>Senha<span class="password-wrap"><input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required><button type="button" class="password-toggle" aria-label="Mostrar senha">◉</button></span></label><label>Confirmar senha<input name="confirmPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><small>A senha deve ter pelo menos 10 caracteres, letra maiúscula, minúscula e número.</small><div class="account-turnstile"></div><button class="account-primary" type="submit">CRIAR UMA CONTA</button><p class="account-feedback" aria-live="polite"></p></form></section></main><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script><script src="js/minha-conta.js?v=tenant-20260818-2"></script><script src="js/tenant-legacy-bridge.js?v=20260818-1"></script></body></html>
