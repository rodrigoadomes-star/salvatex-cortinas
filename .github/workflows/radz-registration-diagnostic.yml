name: RADZ registration diagnostic

on:
  push:
    branches: [radz-unified-production]
    paths-ignore:
      - diagnostics/registration-schema.json

permissions:
  contents: write

jobs:
  registration-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radz-unified-production

      - name: Wait for register-health endpoint and capture schema
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          base='https://radzhub.com.br'
          body=''
          code='000'
          for i in $(seq 1 30); do
            code="$(curl -sS -o /tmp/register-health.json -w '%{http_code}' --max-time 20 "$base/platform/api/register-health" || true)"
            body="$(cat /tmp/register-health.json 2>/dev/null || true)"
            if [ "$code" = '200' ] || [ "$code" = '503' ]; then
              if printf '%s' "$body" | grep -Eq 'REGISTER_SCHEMA_READY|REGISTER_SCHEMA_MISMATCH'; then
                break
              fi
            fi
            sleep 10
          done
          python3 - <<'PY'
          import json, datetime, os
          path='/tmp/register-health.json'
          try:
              data=json.load(open(path))
          except Exception:
              data={'ok':False,'code':'REGISTER_HEALTH_UNAVAILABLE'}
          data['_captured_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          data['_commit']=os.environ.get('GITHUB_SHA','')
          with open('diagnostics/registration-schema.json','w') as f:
              json.dump(data,f,ensure_ascii=False,indent=2)
          print(json.dumps(data,ensure_ascii=False,indent=2))
          PY

      - name: Persist registration diagnostic
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/registration-schema.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: update registration schema diagnostic [skip ci]'
          git push origin HEAD:radz-unified-production
