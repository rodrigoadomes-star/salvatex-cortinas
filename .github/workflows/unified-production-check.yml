name: RADZ unified production checks

on:
  push:
    branches: [radz-unified-production]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check critical JavaScript syntax
        run: |
          node --check js/config.js
          node --check js/configurador-media-strict.js
          node --check js/configurador-media-forro.js
          node --check js/admin-configurator-media-dedupe.js
          node --check js/admin-configurator-combination-stock.js
          node --check js/admin-configurator-media-controls.js
          node --check js/radz-analytics.js
          node --check platform/platform.js
          node --check functions/_middleware.js
          node --check functions/index.js
          node --check functions/radz/api/health.js
          node --check functions/platform/api/_lib.js
          node --check functions/platform/api/_auth.js
          node --check functions/platform/api/login.js
          node --check functions/platform/api/register.js
          node --check radz-admin/radz-admin.js
          node --check radz-admin/meta.js
          node --check radz-admin/infra.js
      - name: Assert storefront and RADZ invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path

          config = Path('js/config.js').read_text()
          strict = Path('js/configurador-media-strict.js').read_text()
          admin = Path('admin/index.html').read_text()
          middleware = Path('functions/_middleware.js').read_text()
          root_fn = Path('functions/index.js').read_text()
          radz_admin = Path('radz-admin/index.html').read_text()
          health = Path('functions/radz/api/health.js').read_text()
          platform_js = Path('platform/platform.js').read_text()
          login = Path('platform/login.html').read_text()
          cadastro = Path('platform/cadastro.html').read_text()

          assert 'estoqueCombinacoes' in config, 'Configurator combination stock state missing'
          assert '[...lista].reverse().find' in strict, 'Latest media record must be authoritative'
          assert 'baseComConteudo' not in strict, 'Legacy media fallback must not return'
          assert 'admin-configurator-media-dedupe.js' in admin
          assert 'admin-configurator-combination-stock.js' in admin
          assert 'admin-configurator-media-controls.js' in admin
          assert 'media-stable-20260817-1' in admin
          assert 'media-stable-20260817-1' in middleware
          assert 'site-bootstrap-script' in middleware, 'Storefront bootstrap missing'
          assert 'radz-analytics.js' in middleware, 'RADZ analytics injection missing'
          assert "h==='radz-hub.pages.dev'" in root_fn, 'RADZ Pages hostname must resolve to RADZ public site'
          assert 'Infraestrutura' in radz_admin and 'infra.js' in radz_admin
          assert 'Nenhum secret é exposto' in health
          assert 'cf-turnstile-response' in platform_js, 'Turnstile hidden response fallback missing'
          assert 'turnstile.getResponse' in platform_js, 'Turnstile direct response retrieval missing'
          assert '20260818-turnstile-3' in login, 'Login auth asset cache marker missing'
          assert '20260818-turnstile-3' in cadastro, 'Signup auth asset cache marker missing'
          print('RADZ unified production invariants OK')
          PY

  production-auth-smoke:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare production deployment
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            LOGIN="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' 'https://radzhub.com.br/platform/login' || true)"
            CADASTRO="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' 'https://radzhub.com.br/platform/cadastro' || true)"
            if printf '%s' "$LOGIN" | grep -q '20260818-turnstile-3' && printf '%s' "$CADASTRO" | grep -q '20260818-turnstile-3'; then
              echo 'Production HTML is on the expected auth version.'
              exit 0
            fi
            echo "Waiting for Cloudflare production deployment ($i/24)..."
            sleep 10
          done
          echo 'Production did not reach the expected auth version in time.' >&2
          exit 1
      - name: Verify production auth JavaScript
        run: |
          set -euo pipefail
          JS="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' 'https://radzhub.com.br/platform/platform.js?v=20260818-turnstile-3')"
          printf '%s' "$JS" | grep -q 'cf-turnstile-response'
          printf '%s' "$JS" | grep -q 'turnstile.getResponse'
          printf '%s' "$JS" | grep -q '/platform/api/register'
          printf '%s' "$JS" | grep -q '/platform/api/login'
          echo 'Production auth JavaScript verified.'
      - name: Verify Turnstile configuration endpoint
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 -H 'Cache-Control: no-cache' 'https://radzhub.com.br/api/turnstile-config' > /tmp/turnstile.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/turnstile.json'))
          assert data.get('ok') is True, data
          assert isinstance(data.get('enabled'), bool), data
          assert isinstance(data.get('enforced'), bool), data
          if data.get('enabled'):
              assert data.get('sitekey'), data
          print('Turnstile config endpoint OK:', {'enabled':data.get('enabled'),'enforced':data.get('enforced')})
          PY
      - name: Verify login API is live without creating data
        run: |
          set -euo pipefail
          CODE="$(curl -sS --max-time 15 -o /tmp/login.json -w '%{http_code}' -X POST 'https://radzhub.com.br/platform/api/login' -H 'content-type: application/json' --data '{"email":"smoke-test-invalid@radzhub.invalid","password":"InvalidSmokePassword1","turnstileToken":""}')"
          cat /tmp/login.json
          if [ "$CODE" != "400" ] && [ "$CODE" != "401" ]; then
            echo "Unexpected login API status: $CODE" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/login.json'))
          assert data.get('ok') is False, data
          print('Login API route is live and rejected invalid access as expected.')
          PY
      - name: Publish production auth smoke status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE=success
            DESCRIPTION='Production auth smoke passed'
          else
            STATE=failure
            DESCRIPTION='Production auth smoke failed'
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"production-auth-smoke\",\"description\":\"$DESCRIPTION\"}"
